# Local Postgres for development and tests (`pnpm dock:up`). Everything
# else OpenPanel needs runs in wrangler dev (queues, crons, R2, Durable
# Objects, Workflows); see the README.
services:
  op-db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - op-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

volumes:
  op-db-data:
